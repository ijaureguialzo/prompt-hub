# The Traefik API and Web UI are disabled on purpose: the dashboard exposes
# the full container topology (services, images, routes) and must never be
# publicly reachable (PLAN.md P1/3). Re-enable deliberately (api: { dashboard:
# true }) + a router in docker-compose.yml, only for private ops networks.
api: false

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    http:
      # HSTS (1y, includeSubDomains) on every HTTPS response — api and
      # frontend hosts. `@file` is explicit: the middleware lives in the
      # file provider (headers.yml), and entrypoint references do not
      # resolve provider middlewares by bare name (PLAN.md P1/4).
      # The CSP is NOT here: it is attached to the frontend router only, so
      # the API keeps its own helmet CSP without stacking.
      middlewares:
        - hsts@file
