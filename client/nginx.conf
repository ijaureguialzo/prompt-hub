# PromptHub static frontend (PLAN.md P3/21)
server {
    listen 5173;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets: content-addressed, immutable for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The favicon lives in public/ (not hashed by Vite), so cache it hard too.
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and the SPA fallback for deep routes) must revalidate, or
    # users keep a stale shell that never picks up new asset hashes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
