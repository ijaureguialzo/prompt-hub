services:
  # PLAN.md P5/32: cap every service's container log (json-file driver)
  # so a verbose error loop cannot fill the disk.
  traefik:
    image: traefik:${TRAEFIK_VERSION:-3}
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # No routers: the Traefik dashboard (api@internal) is disabled in
    # traefik/traefik.yml (it leaks the full service topology), so this
    # service is not exposed on any route (PLAN.md P1/3).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/headers.yml:/etc/traefik/dynamic/headers.yml:ro
      - ./traefik/tls.yml:/etc/traefik/dynamic/tls.yml:ro
      - ./traefik/certs:/certs:ro
    depends_on:
      frontend:
        condition: service_healthy

  api:
    build:
      context: ./server
      args:
        NODE_VERSION: ${NODE_VERSION}
    environment:
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@db:27017/${MONGO_DB}?authSource=admin
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      # 24h session (no refresh flow): the per-request isActive check in
      # middleware/auth.js still revokes tokens on account deactivation
      # (PLAN.md P1/5, trade-off in SPECIFICATION.md §7).
      - JWT_EXPIRES_IN=24h
      - CORS_ORIGIN=${CORS_ORIGIN}
      - MAX_PROMPTS_PER_USER=${MAX_PROMPTS_PER_USER:-200}
      - MAX_CATEGORIES_PER_USER=${MAX_CATEGORIES_PER_USER:-50}
    healthcheck:
      test: [ "CMD", "node", "-e", "const http = require('http'); const req = http.get('http://localhost:3000/api/health', res => { res.resume(); res.on('end', () => process.exit(0)); }); req.on('error', () => process.exit(1));" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.rule=Host(`${FQDN_API:-api.prompthub.test}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.tls=true"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-api.loadbalancer.server.port=3000"
      # Same-origin escape hatch: route the frontend host's /api/ prefix to
      # the API service, with priority over the (lower) frontend router. A
      # SPA built with a relative or frontend-host VITE_API_URL keeps working,
      # so the classic "Traefik 200s index.html for /api" failure is a thing
      # of the past (PLAN.md P0/1).
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api-frontend.rule=Host(`${FQDN_FRONTEND:-prompthub.test}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api-frontend.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api-frontend.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api-frontend.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api-frontend.service=${COMPOSE_PROJECT_NAME}-api"

  frontend:
    build:
      context: ./client
      args:
        NODE_VERSION: ${NODE_VERSION}
        VITE_API_URL: ${VITE_API_URL}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # nginx alpine ships busybox wget (no node in the runtime image
      # anymore); 127.0.0.1 because alpine's `localhost` tries ::1 first
      # and nginx only listens on IPv4.
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:5173/" ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.rule=Host(`${FQDN_FRONTEND:-prompthub.test}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.tls=true"
      # Edge security headers (PLAN.md P1/4): CSP + X-Frame-Options on the
      # SPA only (the API gets its own CSP from helmet); HSTS is attached at
      # the websecure entrypoint for every HTTPS response.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.middlewares=frontend-secure@file"
      # Lower priority than the api-frontend router above, so /api/* on the
      # frontend host always goes to the API service first.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.priority=10"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-frontend.loadbalancer.server.port=5173"

  db:
    image: mongo:${MONGO_VERSION}
    expose:
      - 27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # PLAN.md P5/31: logical backups — mongodump loop (no ports, no routes).
  # Dumps land in the named `backups` volume (one dir per dump, retention
  # via find -mtime). One-shot: `make backup`. Restore: README "Backups".
  backup:
    image: mongo:${MONGO_VERSION}
    environment:
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@db:27017/${MONGO_DB:-promptdb}?authSource=admin
      - BACKUP_INTERVAL_MINUTES=${BACKUP_INTERVAL_MINUTES:-60}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups:/backups
      - ./ops/mongo-backup.sh:/usr/local/bin/mongo-backup.sh:ro
    command: ["/usr/local/bin/mongo-backup.sh", "--loop"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_config:
  backups:
